[package]
name = "tokio-otel-metrics"
version = "0.1.0"
edition = "2021"
description = "OpenTelemetry metrics collection for Tokio runtime with support for OpenTelemetry 0.30+"
license = "Apache-2.0"
repository = "https://github.com/hardbyte/tokio-otel-metrics"
documentation = "https://docs.rs/tokio-otel-metrics"
readme = "README.md"
keywords = ["tokio", "opentelemetry", "metrics", "runtime", "observability"]
categories = ["development-tools::debugging", "asynchronous"]

[dependencies]
opentelemetry = "0.30.0"
tokio = { version = "1.47.1", features = ["rt"] }
tracing = "0.1.41"
once_cell = "1.20.2"

# Optional dependencies for memory metrics
memory-stats = { version = "1.2", optional = true }

[dev-dependencies]
tokio = { version = "1.47.1", features = ["full", "test-util"] }
tokio-test = "0.4"
tracing-subscriber = "0.3.19"
opentelemetry_sdk = "0.30.0"
futures = "0.3"

[features]
default = []
memory-metrics = ["memory-stats"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]