[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core async runtime
tokio = { version = "1.39.3", features = ["full"] }
anyhow = "1.0.95"

# Observability utilities
observability-utils = { path = "../observability-utils" }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
once_cell = "1"

# Kafka client
rdkafka = { version = "0.37.0", features = ["tracing"] }

# Serialization
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"

# Database and DAL
bookapp-dal = { path = "../bookapp-dal" }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid"] }
sqlx-tracing = { workspace = true, features = ["postgres"] }
uuid = { workspace = true }

# Configuration
dotenv = "0.15.0"

# Scheduling and background tasks
tokio-cron-scheduler = "0.14.0"

# Time handling
chrono = { version = "0.4.39", features = ["serde"] }

# Signal handling
signal-hook = "0.3.17"
signal-hook-tokio = { version = "0.3.1", features = ["futures-v0_3"] }


# Async trait support
async-trait = "0.1.86"

[dev-dependencies]
futures = "0.3"
