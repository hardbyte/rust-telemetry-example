[package]
name = "data-loader"
version = "0.1.0"
edition = "2021"

[dependencies]
client = { path = "../client" }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "fs"] }
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = { version = "0.31.0" }
opentelemetry = { version = "0.30.0" }
opentelemetry_sdk = { version = "0.30.0", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.30.0", features = ["reqwest-client", "grpc-tonic"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
rand = "0.9.1"
futures = "0.3"