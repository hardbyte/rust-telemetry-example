[package]
name = "bookapp"
version = "0.1.0"
edition = "2021"


[dependencies]
bookapp-dal = { path = "../bookapp-dal" }
client = { path = "../client" }
# tower-otel-http-metrics 0.16 is pinned to opentelemetry 0.30. We've moved the rest of
# the stack to OT 0.31, so we pull in a second opentelemetry crate under an alias just
# for this middleware. Its meter resolves against a separate (un-initialised) 0.30
# global meter provider, so HTTP RED metrics are effectively a no-op until the crate
# publishes a 0.31-compatible release.
tower-otel-http-metrics = { version = "0.16.0", features = ["axum"] }
opentelemetry_0_30 = { package = "opentelemetry", version = "0.30" }

anyhow = "1.0.98"
axum = { workspace = true, features = ["macros", "matched-path", "tracing" ] }
dotenv = "0.15.0"
opentelemetry = { workspace = true}
opentelemetry-otlp = { version= "0.31.0", features = [
    "serialize",
    "reqwest-client",
    "grpc-tonic",
]}
opentelemetry_sdk = { version= "0.32.1", features = ["trace", "opentelemetry-http", "rt-tokio"]}
serde = "1.0.219"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.46.1", features = ["full", "tracing"] }
tower = {workspace = true}
tower-http = { version = "0.6.6", features = ["trace"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { version = "0.3.20", features=["fmt", "env-filter", "json", "tracing-log"] }
reqwest = {workspace = true}

reqwest-middleware = { version="0.5.1", features = ["json"] }
reqwest-tracing = { version="0.7.0",  features = ["opentelemetry_0_31"] }

futures = "0.3.31"

axum-tracing-opentelemetry = { version = "0.33.1", features = [] }

tracing-opentelemetry-instrumentation-sdk = { version = "0.32.5", features = ["tracing_level_info"] }


rdkafka = { version = "0.37.0", features = ["tokio"] }
serde_json = "1.0.141"
opentelemetry-http = "0.31.0"
tracing-loki = "0.2.6"
hostname = "0.4.0"
opentelemetry-appender-tracing = { version = "0.31.0" , features = ["experimental_use_tracing_span_context"]}
sentry = { version = "0.41", features = ["tower", "tracing", "opentelemetry", "logs"] }
sentry-tower = { version = "0.41", features = ["http", "axum-matched-path"] }
hyper = "1.6.0"
rand = "0.9.1"
matchit = "^0.8"
console-subscriber = "0.4.1"
async-trait = "0.1.87"
