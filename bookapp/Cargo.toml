[package]
name = "bookapp"
version = "0.1.0"
edition = "2021"


[dependencies]
bookapp-dal = { path = "../bookapp-dal" }
client = { path = "../client" }

anyhow = "1.0.104"
axum = { workspace = true, features = ["macros", "matched-path", "tracing" ] }
dotenv = "0.15.0"
opentelemetry = { workspace = true}
opentelemetry-otlp = { version= "0.32.0", features = [
    "serialize",
    "reqwest-client",
    "grpc-tonic",
]}
opentelemetry_sdk = { version= "0.32.1", features = ["trace", "opentelemetry-http", "rt-tokio"]}
serde = "1.0.229"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.53.1", features = ["full", "tracing"] }
tower = {workspace = true}
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { version = "0.3.23", features=["fmt", "env-filter", "json", "tracing-log"] }
reqwest = {workspace = true}

reqwest-middleware = { version="0.5.2", features = ["json"] }
reqwest-tracing = { version="0.7.1",  features = ["opentelemetry_0_32"] }

futures = "0.3.34"

axum-tracing-opentelemetry = { version = "0.39.1", features = [] }

tracing-opentelemetry-instrumentation-sdk = { version = "0.38.3", features = ["tracing_level_info"] }


rdkafka = { version = "0.39.0", features = ["tokio"] }
serde_json = "1.0.151"
opentelemetry-http = "0.32.0"
tracing-loki = "0.2.7"
hostname = "0.4.2"
opentelemetry-appender-tracing = { version = "0.32.0"}
sentry = { version = "0.49", features = ["tower", "tracing", "opentelemetry", "logs"] }
sentry-tower = { version = "0.49", features = ["http", "axum-matched-path"] }
hyper = "1.11.1"
rand = "0.10.2"
matchit = "^0.9"
console-subscriber = "0.5.0"
async-trait = "0.1.92"

[dev-dependencies]
sentry = { version = "0.49", features = ["test"] }
