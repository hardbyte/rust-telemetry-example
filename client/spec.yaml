openapi: 3.0.3
info:
  title: Book Service API
  description: API for managing books in the library with distributed tracing support
  version: "1.0.0"
servers:
  - url: http://localhost:8000
    description: Local development server
paths:
  /books:
    get:
      summary: Get all books
      operationId: getAllBooks
      tags:
        - Books
      parameters:
        - in: query
          name: limit
          description: Maximum number of books to return (default 100, max 500)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - in: query
          name: offset
          description: Number of books to skip before returning results
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A list of books
          headers:
            x-pagination-limit:
              description: Sanitized limit that was applied
              schema:
                type: integer
            x-pagination-offset:
              description: Offset supplied for the returned page
              schema:
                type: integer
            x-pagination-next-offset:
              description: Offset to request the next page
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
        '503':
          description: Service unavailable
  /books/add:
    post:
      summary: Create a new book
      operationId: createBook
      tags:
        - Books
      requestBody:
        description: Data for the new book
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreateIn'
      responses:
        '201':
          description: ID of the newly created book
          content:
            text/plain:
              schema:
                type: string
                format: uuid
        '422':
          description: Validation error
  /books/{id}:
    get:
      summary: Get a book by ID
      operationId: getBook
      tags:
        - Books
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the book
      responses:
        '200':
          description: A single book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Book not found
    patch:
      summary: Update a book by ID
      operationId: updateBook
      tags:
        - Books
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the book
      requestBody:
        description: Data to update the book
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreateIn'
      responses:
        '200':
          description: ID of the updated book
          content:
            text/plain:
              schema:
                type: integer
                format: int32
        '404':
          description: Book not found
    delete:
      summary: Delete a book by ID
      operationId: deleteBook
      tags:
        - Books
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the book
      responses:
        '200':
          description: Book deleted successfully
        '404':
          description: Book not found
  /books/search:
    get:
      summary: Search books
      operationId: searchBooks
      tags:
        - Books
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Maximum results
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSearchResult'
components:
  schemas:
    Book:
      type: object
      required:
        - id
        - work_id
        - work_title
        - primary_author_id
        - primary_author_name
        - status
      properties:
        id:
          type: string
          format: uuid
        work_id:
          type: string
          format: uuid
        work_title:
          type: string
        primary_author_id:
          type: string
          format: uuid
        primary_author_name:
          type: string
        status:
          type: string
          enum: [Available, Borrowed, Lost]
    BookCreateIn:
      type: object
      required:
        - work_title
      properties:
        work_title:
          type: string
        primary_author_name:
          type: string
        primary_author_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [Available, Borrowed, Lost]
    BookSearchResult:
      type: object
      required:
        - work_id
        - work_title
        - primary_author_name
        - rank
      properties:
        work_id:
          type: string
          format: uuid
        work_title:
          type: string
        primary_author_name:
          type: string
        rank:
          type: number
          format: float
        headline:
          type: string
  /books/id_list:
    get:
      summary: Get book IDs
      operationId: getBookIds
      tags:
        - Books
      parameters:
        - in: query
          name: limit
          description: Maximum number of book IDs to return (default 100, max 500)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - in: query
          name: offset
          description: Number of IDs to skip before returning results
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A list of book IDs
          headers:
            x-pagination-limit:
              description: Sanitized limit that was applied
              schema:
                type: integer
            x-pagination-offset:
              description: Offset supplied for the returned page
              schema:
                type: integer
            x-pagination-next-offset:
              description: Offset to request the next page
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
        '503':
          description: Service unavailable
