[package]
name = "error-injection-dal"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "chrono",
    "migrate"
] }
sqlx-tracing = { workspace = true, features = ["postgres"] }
tracing = "0.1.41"
