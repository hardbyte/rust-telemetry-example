[package]
name = "bookapp-dal"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.98"
async-trait = "0.1.84"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
chrono = { version = "0.4.38", features = ["serde"] }
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "json",
] }
# sqlx-conditional-queries = { version = "0.3.2", features = ["postgres"] } # Commented out for now
thiserror = "2.0.8"
tokio = { version = "1.46.1", features = ["full"] }
tracing = "0.1.41"

[dev-dependencies]
dotenv = "0.15.0"
tokio-test = "0.4.4"

[package.metadata.sqlx]
offline = true
