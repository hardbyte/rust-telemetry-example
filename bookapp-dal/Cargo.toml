[package]
name = "bookapp-dal"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "migrate"] }
# sqlx-conditional-queries = { version = "0.3.2", features = ["postgres"] } # Commented out for now
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"

[dev-dependencies]
dotenv = "0.15.0"
tokio-test = "0.4.5"

[package.metadata.sqlx]
offline = true
