[package]
name = "observability-utils"
version = "0.1.0"
edition = "2021"
description = "Shared observability utilities for tracing, metrics, and error tracking"

[dependencies]
anyhow = "1.0.98"
opentelemetry = { workspace = true }
opentelemetry-appender-tracing = { version = "0.30.1", features = ["experimental_use_tracing_span_context"] }
opentelemetry-otlp = { version = "0.30.0", features = [
    "serialize",
    "reqwest-client",
    "grpc-tonic",
] }
opentelemetry_sdk = { version = "0.30.0", features = ["trace", "opentelemetry-http", "rt-tokio"] }
sentry = { version = "0.41", features = ["tower", "tracing", "opentelemetry", "logs"] }
tokio = { version = "1.46.1", features = ["full"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true, features = ["async-trait"] }
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter", "json", "tracing-log"] }
console-subscriber = "0.4.1"
console-api = "0.8.1"
tonic = "0.12.3"